<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World - Your Name</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      color: #17324d;
      background: #f4efe6;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: linear-gradient(135deg, #f4efe6 0%, #dceff0 100%);
    }

    main {
      width: min(90%, 34rem);
      padding: 3rem 2rem;
      text-align: center;
      background: #fffdf8;
      border: 1px solid #c9d8d8;
      box-shadow: 0 1rem 2rem rgb(23 50 77 / 12%);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.2rem, 8vw, 4rem);
      line-height: 1;
    }

    p {
      margin: 0;
      font-size: 1.15rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World!</h1>
    <p>My name is <strong>Your Name</strong>.</p>
  </main>
</body>
</html>
